<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字卡學習系統 - GitHub Pages 版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f4f5f7;
            user-select: none;
        }

        /* 3D 卡片翻轉效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .btn-active:active {
            transform: scale(0.95);
        }
    </style>
</head>
<!-- STREAMING_CHUNK: Rendering GitHub Pages UI layout... -->
<body class="min-h-screen flex flex-col justify-between items-center p-4 md:p-8 relative">

    <!-- Toast 通知訊息元件 -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div id="toastContent" class="bg-gray-800 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 text-sm font-medium">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMessage">訊息提示</span>
        </div>
    </div>

    <!-- 頂部標題列 -->
    <header class="w-full max-w-2xl flex justify-between items-center mb-4">
        <div class="flex items-center space-x-2">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800" id="appTitle">字卡學習</h1>
            <span id="syncBadge" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1">
                <i class="fa-solid fa-spinner animate-spin text-xs"></i> 載入中...
            </span>
        </div>
        
        <!-- 操作選單按鈕區 -->
        <div class="flex items-center space-x-2">
            <button onclick="openConfigModal()" title="設定 API 網址" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <button onclick="openFormModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-medium px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-md transition btn-active">
                <i class="fa-solid fa-plus"></i>
                <span>新增題目</span>
            </button>
            <button onclick="shuffleCards()" title="隨機洗牌" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition">
                <i class="fa-solid fa-shuffle"></i>
            </button>
            <button onclick="resetProgress()" title="重置進度" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- STREAMING_CHUNK: Rendering main flashcard element... -->
    <!-- 主卡片區塊 -->
    <main class="w-full max-w-2xl flex-1 flex flex-col justify-center items-center my-auto">
        <div class="w-full h-[380px] md:h-[420px] perspective-1000 cursor-pointer" onclick="flipCard()">
            <div id="cardInner" class="relative w-full h-full transform-style-3d shadow-2xl rounded-[32px]">
                
                <!-- 卡片正面 (題目) -->
                <div class="absolute inset-0 w-full h-full bg-[#2c2c2e] text-white rounded-[32px] p-8 flex flex-col justify-between backface-hidden border border-gray-700">
                    <!-- 正面頂部：計數與編輯/刪除快捷按鈕 -->
                    <div class="flex justify-between items-center text-gray-400 text-sm font-medium">
                        <span id="cardProgressFront">0/0</span>
                        <div class="flex items-center gap-3">
                            <button onclick="event.stopPropagation(); openFormModal('edit')" title="編輯此題" class="hover:text-blue-400 transition p-1">
                                <i class="fa-solid fa-pen-to-square text-base"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openDeleteModal()" title="刪除此題" class="hover:text-red-400 transition p-1">
                                <i class="fa-solid fa-trash-can text-base"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 正面中央：題目內容 -->
                    <div class="flex-1 flex justify-center items-center my-4 overflow-y-auto px-2">
                        <p id="questionText" class="text-2xl md:text-3xl font-medium text-center leading-relaxed tracking-wide">
                            正在讀取題目...
                        </p>
                    </div>
                    
                    <!-- 正面底部：提示字樣 -->
                    <div class="text-center text-gray-400 text-sm font-medium">
                        點擊卡片查看答案
                    </div>
                </div>

                <!-- 卡片背面 (答案) -->
                <div class="absolute inset-0 w-full h-full bg-[#1c1c1e] text-white rounded-[32px] p-8 flex flex-col justify-between backface-hidden rotate-y-180 border border-emerald-900/50">
                    <!-- 背面頂部：計數 -->
                    <div class="flex justify-between items-center text-emerald-400 text-sm font-medium">
                        <span id="cardProgressBack">0/0</span>
                        <div class="flex items-center gap-3">
                            <button onclick="event.stopPropagation(); openFormModal('edit')" title="編輯此題" class="hover:text-blue-400 transition p-1">
                                <i class="fa-solid fa-pen-to-square text-base"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openDeleteModal()" title="刪除此題" class="hover:text-red-400 transition p-1">
                                <i class="fa-solid fa-trash-can text-base"></i>
                            </button>
                            <span class="bg-emerald-950/80 text-emerald-400 px-3 py-1 rounded-full text-xs border border-emerald-800 ml-1">解答</span>
                        </div>
                    </div>
                    
                    <!-- 背面中央：答案內容 -->
                    <div class="flex-1 flex justify-center items-center my-4 overflow-y-auto px-2">
                        <p id="answerText" class="text-xl md:text-2xl font-medium text-center leading-relaxed text-emerald-100">
                            正在讀取答案...
                        </p>
                    </div>
                    
                    <!-- 背面底部：提示字樣 -->
                    <div class="text-center text-gray-400 text-sm font-medium">
                        點擊卡片翻回題目
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- STREAMING_CHUNK: Rendering footer controls... -->
    <!-- 底部控制導覽列 -->
    <footer class="w-full max-w-2xl mt-6 flex justify-center items-center gap-4 md:gap-6">
        <!-- 上一題 -->
        <button id="prevBtn" onclick="prevCard()" class="btn-active w-14 h-14 rounded-full bg-white border border-blue-200 text-blue-600 hover:bg-blue-50 flex justify-center items-center shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>

        <!-- ✕ 不熟悉/錯誤統計 -->
        <button onclick="markCard(false)" class="btn-active min-w-[90px] h-12 px-5 rounded-full bg-white border border-gray-200 text-red-500 hover:bg-red-50 flex justify-center items-center gap-2 shadow-md transition font-semibold text-base">
            <i class="fa-solid fa-xmark text-lg"></i>
            <span id="wrongCount">0</span>
        </button>

        <!-- ✓ 已掌握/正確統計 -->
        <button onclick="markCard(true)" class="btn-active min-w-[90px] h-12 px-5 rounded-full bg-white border border-gray-200 text-emerald-600 hover:bg-emerald-50 flex justify-center items-center gap-2 shadow-md transition font-semibold text-base">
            <span id="correctCount">0</span>
            <i class="fa-solid fa-check text-lg"></i>
        </button>

        <!-- 下一題 -->
        <button id="nextBtn" onclick="nextCard()" class="btn-active w-14 h-14 rounded-full bg-white border border-blue-200 text-blue-600 hover:bg-blue-50 flex justify-center items-center shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-arrow-right text-xl"></i>
        </button>
    </footer>

    <!-- STREAMING_CHUNK: Rendering Config, Add, Edit, Delete Modals... -->
    <!-- 1. API 網址設定彈窗 (Config Modal) -->
    <div id="configModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl transition-all transform scale-95 opacity-0" id="configModalCard">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">設定 GAS Web App API 網址</h3>
                <button onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-600 p-1 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <p class="text-sm text-gray-500 mb-4">
                請貼上您在 Google Apps Script 部署後獲得的「網路應用程式 URL」（以 <code class="bg-gray-100 text-pink-600 px-1 py-0.5 rounded">/exec</code> 結尾）。
            </p>

            <form onsubmit="saveApiConfig(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">API Web App URL</label>
                    <input id="apiUrlInput" type="url" required placeholder="https://script.google.com/macros/s/.../exec" class="w-full border border-gray-300 rounded-xl p-3 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeConfigModal()" class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-medium hover:bg-gray-100 transition">
                        取消
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 transition">
                        儲存並連線
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 新增 / 編輯彈窗 (Form Modal) -->
    <div id="formModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl transition-all transform scale-95 opacity-0" id="formModalCard">
            <div class="flex justify-between items-center mb-4">
                <h3 id="formModalTitle" class="text-xl font-bold text-gray-800">新增字卡</h3>
                <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600 p-1 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">題目</label>
                    <textarea id="modalQuestionInput" required rows="3" placeholder="請輸入題目內容..." class="w-full border border-gray-300 rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">答案</label>
                    <textarea id="modalAnswerInput" required rows="3" placeholder="請輸入答案內容..." class="w-full border border-gray-300 rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeFormModal()" class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-medium hover:bg-gray-100 transition">
                        取消
                    </button>
                    <button type="submit" id="saveBtn" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 transition flex items-center gap-2">
                        <i id="saveBtnSpinner" class="fa-solid fa-spinner animate-spin hidden"></i>
                        <span id="saveBtnText">儲存</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. 刪除確認彈窗 (Delete Modal) -->
    <div id="deleteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl transition-all transform scale-95 opacity-0 text-center" id="deleteModalCard">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex justify-center items-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">確認刪除字卡？</h3>
            <p class="text-gray-500 text-sm mb-6">這將會從 Google 試算表中永久移除這張題目與解答，無法復原。</p>
            
            <div class="flex justify-center gap-3">
                <button onclick="closeDeleteModal()" class="w-1/2 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-medium hover:bg-gray-100 transition">
                    取消
                </button>
                <button id="confirmDeleteBtn" onclick="executeDelete()" class="w-1/2 py-2.5 rounded-xl bg-red-600 text-white font-medium hover:bg-red-700 transition flex justify-center items-center gap-2">
                    <i id="deleteBtnSpinner" class="fa-solid fa-spinner animate-spin hidden"></i>
                    <span>確認刪除</span>
                </button>
            </div>
        </div>
    </div>

    <!-- STREAMING_CHUNK: Fetch API logic and state management... -->
    <script>
        // 設定與狀態管理
        let gasApiUrl = localStorage.getItem('gas_flashcard_api_url') || '';
        let cards = [];
        let currentIndex = 0;
        let isFlipped = false;
        let correctCount = 0;
        let wrongCount = 0;
        let currentMode = 'add';

        // 本地離線預設資料
        const mockCards = [
            { rowIndex: 2, question: "為了降低受攻擊面，應停用 Windows 的哪種腳本宿主功能？", answer: "Windows Script Host (WSH)" },
            { rowIndex: 3, question: "什麼是雙因素驗證 (2FA)？", answer: "結合兩種不同類型的機制（如密碼 + 手機驗證碼）來驗證使用者身分。" },
            { rowIndex: 4, question: "社交工程攻擊中最常見的形式是什麼？", answer: "釣魚郵件 (Phishing Email)" },
            { rowIndex: 5, question: "HTTPS 中傳輸加密主要依賴哪種協定？", answer: "TLS (Transport Layer Security) / SSL" }
        ];

        window.onload = function() {
            if (gasApiUrl) {
                fetchCardsFromAPI();
            } else {
                // 未設定 API 時使用 Demo 資料，並提醒使用者設定 API
                cards = JSON.parse(JSON.stringify(mockCards));
                renderCard();
                updateSyncStatus('demo', '示範模式 (點選⚙️設定API)');
            }
            setupKeyboardListeners();
        };

        /* STREAMING_CHUNK: Handling HTTP fetch request to GAS... */
        function fetchCardsFromAPI() {
            if (!gasApiUrl) {
                openConfigModal();
                return;
            }

            updateSyncStatus('loading', '讀取中...');

            fetch(gasApiUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.success && Array.isArray(data.data)) {
                        cards = data.data;
                        if (currentIndex >= cards.length) {
                            currentIndex = Math.max(0, cards.length - 1);
                        }
                        updateSyncStatus('success', '已連線');
                        renderCard();
                    } else {
                        onApiError(data.message || '格式解析錯誤');
                    }
                })
                .catch(err => {
                    console.error('Fetch Error:', err);
                    onApiError('連線失敗，請檢查 API 網址與 CORS 設定');
                });
        }

        /* STREAMING_CHUNK: Posting HTTP requests for CRUD actions... */
        function postToAPI(payload, onSuccess, onError) {
            if (!gasApiUrl) {
                showToast('請先設定 API 網址', 'error');
                onError();
                return;
            }

            // 使用 text/plain content-type 避免觸發 OPTIONS 預檢請求
            fetch(gasApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    onSuccess(data);
                } else {
                    showToast(data.message || '操作失敗', 'error');
                    onError();
                }
            })
            .catch(err => {
                console.error('POST Error:', err);
                showToast('連線失敗，請檢查網路或 API 網址', 'error');
                onError();
            });
        }

        function onApiError(errMsg) {
            updateSyncStatus('error', '連線失敗');
            showToast(errMsg, 'error');
        }

        /* STREAMING_CHUNK: Card rendering logic... */
        function renderCard() {
            if (cards.length === 0) {
                renderEmptyCard();
                return;
            }

            isFlipped = false;
            document.getElementById('cardInner').classList.remove('rotate-y-180');

            const card = cards[currentIndex];
            const progressStr = `${currentIndex + 1}/${cards.length}`;

            document.getElementById('questionText').innerText = card.question || '（此題無內容）';
            document.getElementById('answerText').innerText = card.answer || '（此題無解答）';
            
            document.getElementById('cardProgressFront').innerText = progressStr;
            document.getElementById('cardProgressBack').innerText = progressStr;
            document.getElementById('correctCount').innerText = correctCount;
            document.getElementById('wrongCount').innerText = wrongCount;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === cards.length - 1;
        }

        function renderEmptyCard() {
            isFlipped = false;
            document.getElementById('cardInner').classList.remove('rotate-y-180');
            document.getElementById('questionText').innerText = "目前沒有任何字卡，點擊右上角「新增題目」建立第一張卡片！";
            document.getElementById('answerText').innerText = "尚未有解答";
            document.getElementById('cardProgressFront').innerText = "0/0";
            document.getElementById('cardProgressBack').innerText = "0/0";
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
        }

        function flipCard() {
            if (cards.length === 0) return;
            isFlipped = !isFlipped;
            const cardInner = document.getElementById('cardInner');
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
            } else {
                cardInner.classList.remove('rotate-y-180');
            }
        }

        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function markCard(isCorrect) {
            if (cards.length === 0) return;
            if (isCorrect) correctCount++;
            else wrongCount++;

            if (currentIndex < cards.length - 1) {
                nextCard();
            } else {
                renderCard();
            }
        }

        function shuffleCards() {
            if (cards.length <= 1) return;
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            renderCard();
            showToast('已完成隨機洗牌', 'info');
        }

        function resetProgress() {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            renderCard();
            showToast('已重置閱讀與答題進度', 'info');
        }

        /* STREAMING_CHUNK: Modal controls and event handlers... */
        function openConfigModal() {
            document.getElementById('apiUrlInput').value = gasApiUrl;
            const modal = document.getElementById('configModal');
            const modalCard = document.getElementById('configModalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeConfigModal() {
            const modal = document.getElementById('configModal');
            const modalCard = document.getElementById('configModalCard');
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function saveApiConfig(e) {
            e.preventDefault();
            const inputVal = document.getElementById('apiUrlInput').value.trim();
            if (!inputVal) return;
            gasApiUrl = inputVal;
            localStorage.setItem('gas_flashcard_api_url', gasApiUrl);
            closeConfigModal();
            showToast('API 網址設定已儲存', 'success');
            fetchCardsFromAPI();
        }

        function openFormModal(mode) {
            currentMode = mode;
            const modal = document.getElementById('formModal');
            const modalCard = document.getElementById('formModalCard');
            const title = document.getElementById('formModalTitle');
            const questionInput = document.getElementById('modalQuestionInput');
            const answerInput = document.getElementById('modalAnswerInput');

            if (mode === 'add') {
                title.innerText = '新增字卡';
                questionInput.value = '';
                answerInput.value = '';
            } else {
                if (cards.length === 0) return;
                title.innerText = '編輯字卡';
                questionInput.value = cards[currentIndex].question;
                answerInput.value = cards[currentIndex].answer;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeFormModal() {
            const modal = document.getElementById('formModal');
            const modalCard = document.getElementById('formModalCard');
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const question = document.getElementById('modalQuestionInput').value.trim();
            const answer = document.getElementById('modalAnswerInput').value.trim();
            if (!question || !answer) return;

            setSaveLoading(true);

            const payload = currentMode === 'add'
                ? { action: 'add', question, answer }
                : { action: 'update', rowIndex: cards[currentIndex].rowIndex, question, answer };

            if (!gasApiUrl) {
                // 本地模擬
                setTimeout(() => {
                    if (currentMode === 'add') {
                        cards.push({ rowIndex: cards.length + 2, question, answer });
                        currentIndex = cards.length - 1;
                    } else {
                        cards[currentIndex].question = question;
                        cards[currentIndex].answer = answer;
                    }
                    setSaveLoading(false);
                    closeFormModal();
                    showToast('已更新（示範模式）', 'success');
                    renderCard();
                }, 500);
                return;
            }

            postToAPI(
                payload,
                (res) => {
                    setSaveLoading(false);
                    closeFormModal();
                    showToast(res.message || '儲存成功！', 'success');
                    fetchCardsFromAPI();
                },
                () => setSaveLoading(false)
            );
        }

        function openDeleteModal() {
            if (cards.length === 0) return;
            const modal = document.getElementById('deleteModal');
            const modalCard = document.getElementById('deleteModalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const modalCard = document.getElementById('deleteModalCard');
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function executeDelete() {
            if (cards.length === 0) return;
            setDeleteLoading(true);

            const card = cards[currentIndex];

            if (!gasApiUrl) {
                setTimeout(() => {
                    cards.splice(currentIndex, 1);
                    setDeleteLoading(false);
                    closeDeleteModal();
                    showToast('已刪除（示範模式）', 'success');
                    if (currentIndex >= cards.length) {
                        currentIndex = Math.max(0, cards.length - 1);
                    }
                    renderCard();
                }, 500);
                return;
            }

            postToAPI(
                { action: 'delete', rowIndex: card.rowIndex },
                (res) => {
                    setDeleteLoading(false);
                    closeDeleteModal();
                    showToast('卡片已成功刪除', 'success');
                    fetchCardsFromAPI();
                },
                () => setDeleteLoading(false)
            );
        }

        function setSaveLoading(loading) {
            const spinner = document.getElementById('saveBtnSpinner');
            const btnText = document.getElementById('saveBtnText');
            const btn = document.getElementById('saveBtn');
            btn.disabled = loading;
            if (loading) {
                spinner.classList.remove('hidden');
                btnText.innerText = '處理中...';
            } else {
                spinner.classList.add('hidden');
                btnText.innerText = '儲存';
            }
        }

        function setDeleteLoading(loading) {
            const spinner = document.getElementById('deleteBtnSpinner');
            const btn = document.getElementById('confirmDeleteBtn');
            btn.disabled = loading;
            if (loading) spinner.classList.remove('hidden');
            else spinner.classList.add('hidden');
        }

        /* STREAMING_CHUNK: Toast alert notifications and keyboard event listeners... */
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-red-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 2500);
        }

        function updateSyncStatus(status, message) {
            const badge = document.getElementById('syncBadge');
            if (status === 'loading') {
                badge.className = 'bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1';
                badge.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-xs"></i> ${message}`;
                badge.classList.remove('hidden');
            } else if (status === 'success') {
                badge.className = 'bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1';
                badge.innerHTML = `<i class="fa-solid fa-check text-xs"></i> ${message}`;
                setTimeout(() => badge.classList.add('hidden'), 2500);
            } else if (status === 'demo') {
                badge.className = 'bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1';
                badge.innerHTML = `<i class="fa-solid fa-eye text-xs"></i> ${message}`;
                badge.classList.remove('hidden');
            } else {
                badge.className = 'bg-red-100 text-red-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1';
                badge.innerHTML = `<i class="fa-solid fa-circle-exclamation text-xs"></i> ${message}`;
                badge.classList.remove('hidden');
            }
        }

        function setupKeyboardListeners() {
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.key === 'ArrowRight') {
                    nextCard();
                } else if (e.key === 'ArrowLeft') {
                    prevCard();
                } else if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    flipCard();
                }
            });
        }
    </script>
</body>
</html>
